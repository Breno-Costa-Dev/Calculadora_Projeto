<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>
    <h1>Digite o número e confirme para gerar uma tabuada</h1>
    <div class="geral">
            <div class="conteiner">
                <label for="tabuada">Tabuada do:</label>
                 <label for="multiplicar">Multiplicar até:</label>
            </div>
            <div class="conteiner">
                <input type="number" name="tabuada" id="tabuada">
                <input type="number" name="multiplicar" id="multiplicar">
            </div>
        <input type="button" value="Calcular" id="calcular">
    </div>
    <h1>Tabuada do número:</h1>
    <div class="geral2">
       
        <p>Informe um numero para calcular uma tabuada...</p>
        <p id="res"></p>
    </div>
</body>
</html>
